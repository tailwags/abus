[workspace]
members = ["crates/*"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Matilde Morrone <contact@rosymati.com>"]
repository = "https://github.com/tailwags/abus"

[workspace.dependencies]
abus = { path = "crates/abus", version = "0.0.3" }
anchovy = "0.4.1"
anyhow = "1.0.104"
bitflags = "2.13.2"
bytes = "1.12.1"
futures-core = "0.3.34"
futures-sink = "0.3.34"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
itoa = "1.0.18"
pin-project-lite = "0.2.17"
quick-xml = "0.42.0"
rustix = "1.1.5"
sap = "0.2.0"
serde = "1.0.229"
serde_core = "1.0.229"
tokio = "1.53.2"
tokio-stream = { version = "0.1.19", default-features = false }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
# anchovy = { path = "../anchovy" }
# anchovy = { git = "https://github.com/tailwags/anchovy" }
